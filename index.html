<script>
// ── Motor / Engine (korbdo.co.kr Edania2 haritasının TR/EN uyarlaması)
const BASE='https://www.korbdo.co.kr/Edania2/';
const IMGV='1786619715';
const imgURL=src=>BASE+encodeURI(src)+'?v='+IMGV;
const COIN_ICON=imgURL('img/00890085.webp');

const M=window.MARKERS,TILES=window.TILES||{};
const W=M.meta.world;
const SECTOR=W.sector,TILE=W.tile;
const WORLD_X0=W.sx0*SECTOR,WORLD_Z1=(W.sz1+1)*SECTOR;
const LEVELS=W.levels.slice().sort((a,b)=>a-b);
const toU=wx=>(wx-WORLD_X0)/SECTOR;
const toV=wz=>(WORLD_Z1-wz)/SECTOR;
const OCEAN='#183435';

const cv=document.getElementById('map'),ctx=cv.getContext('2d');
const tipEl=document.getElementById('tip'),selEl=document.getElementById('sel');
let DPR=1,VW=0,VH=0;
const CHEST=['relic','trace'];
const DONE_ALPHA=0.18; // bulunanlar iyice soluk / found markers strongly faded

// ── Dil / Language
const LANG_STORE='bdo_tachyon_lang';
let lang='tr';
try{const s=localStorage.getItem(LANG_STORE);if(s==='en'||s==='tr')lang=s;}catch(e){}
const T=()=>L10N[lang];
const li=()=>lang==='en'?1:0;

function applyNames(){
  const t=T(),i=li();
  for(const p of M.points.relic){p.n=t.chest.relic(p.rom);p.a=AREA[p.ai][i];}
  for(const p of M.points.trace){p.n=p.special?t.gigagod:t.chest.trace(p.rom);p.a=AREA[p.ai][i];}
  for(const p of M.points.klore){p.n=i?p.en:p.tr;}
  for(const p of M.points.node){p.n=i?p.en:p.tr;}
  for(const p of M.points.npc){p.n=i?p.en:p.tr;}
}

const radius=id=>CHEST.includes(id)?Math.max(2.8,Math.min(6.5,view.k*.22)):Math.max(2.2,Math.min(5.0,view.k*.17));
const on={};for(const id in M.points)on[id]=true;
const DONEABLE=['relic','trace','klore'].flatMap(id=>M.points[id]||[]);

// ── Bulunanlar / Found marks — localStorage, dil-bağımsız anahtarlar
const STORE='bdo_tachyon_done_tr';
const keyOf=p=>`${p.kind}-${p.num}`;
// v1 anahtar taşıma / migrate old v1 keys
const migrate=k=>k.replace(/^Miras-/, 'relic-').replace(/^İz-/, 'trace-').replace(/^Bilgi-/, 'klore-');
let DONE=new Set();
try{DONE=new Set((JSON.parse(localStorage.getItem(STORE)||'[]')).map(migrate));}catch(e){}
const saveDone=()=>{try{localStorage.setItem(STORE,JSON.stringify([...DONE]));}catch(e){}};
const isDone=p=>p.kind&&DONE.has(keyOf(p));
let hideFound=false;
try{hideFound=localStorage.getItem('bdo_tachyon_hidefound')==='1';}catch(e){}

const IMG=window.IMAGES||{};
const imagesFor=p=>p.kind?(IMG[keyOf(p)]||[]):[];

// ── Görünür alan / Viewable box
const PAD=2.5;
const BOX=(()=>{let x0=1e9,x1=-1e9,z0=1e9,z1=-1e9;
  for(const id in M.points)for(const p of M.points[id]){x0=Math.min(x0,p.x);x1=Math.max(x1,p.x);z0=Math.min(z0,p.z);z1=Math.max(z1,p.z);}
  return{u0:toU(x0)-PAD,u1:toU(x1)+PAD,v0:toV(z1)-PAD,v1:toV(z0)+PAD};})();
const BOXW=BOX.u1-BOX.u0,BOXH=BOX.v1-BOX.v0;
const view={u:(BOX.u0+BOX.u1)/2,v:(BOX.v0+BOX.v1)/2,k:8};
let sel=null;

// ── Karo önbelleği / Tile cache
const cache=new Map();
const have={};for(const l in TILES)have[l]=new Set(TILES[l]);
function tileImg(lvl,tx,ty){
  const key=lvl+'/'+tx+'_'+ty;
  let im=cache.get(key);
  if(im!==undefined)return im;
  if(have[lvl]&&!have[lvl].has(tx+'_'+ty)){cache.set(key,null);return null;}
  im=new Image();
  im.onload=()=>draw();
  im.onerror=()=>cache.set(key,null);
  im.src=BASE+`img/tiles/L${lvl}/${tx}_${ty}.webp`;
  cache.set(key,im);
  return im;
}
function pickLevel(){for(const l of LEVELS)if(l>=view.k)return l;return LEVELS[LEVELS.length-1];}
const sx=u=>(u-view.u)*view.k+VW/2;
const sy=v=>(v-view.v)*view.k+VH/2;
const pux=px=>(px-VW/2)/view.k+view.u;
const pvy=py=>(py-VH/2)/view.k+view.v;
const kFit=()=>Math.min(VW/BOXW,VH/BOXH);
function clamp(){
  view.k=Math.max(kFit(),Math.min(256,view.k));
  const hu=VW/(2*view.k),hv=VH/(2*view.k);
  view.u=hu*2>=BOXW?(BOX.u0+BOX.u1)/2:Math.max(BOX.u0+hu,Math.min(BOX.u1-hu,view.u));
  view.v=hv*2>=BOXH?(BOX.v0+BOX.v1)/2:Math.max(BOX.v0+hv,Math.min(BOX.v1-hv,view.v));
}
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  VW=innerWidth;VH=innerHeight;
  cv.width=VW*DPR;cv.height=VH*DPR;
  cv.style.width=VW+'px';cv.style.height=VH+'px';
  clamp();draw();
}
const hidden=p=>hideFound&&isDone(p);
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,VW,VH);
  ctx.fillStyle=OCEAN;
  ctx.fillRect(0,0,VW,VH);
  const lvl=pickLevel();
  const span=TILE/lvl,px=span*view.k;
  ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
  for(let ty=Math.floor(pvy(0)/span);ty<Math.ceil(pvy(VH)/span);ty++){
    for(let tx=Math.floor(pux(0)/span);tx<Math.ceil(pux(VW)/span);tx++){
      if(tx<0||ty<0)continue;
      const im=tileImg(lvl,tx,ty);
      if(!im||!im.complete||!im.naturalWidth)continue;
      ctx.drawImage(im,sx(tx*span),sy(ty*span),px+1,px+1);
    }
  }
  for(const id of ['npc','node','klore','trace','relic']){
    if(!on[id]||!M.points[id])continue;
    const r=radius(id);
    const col=M.meta.layers[id].color;
    ctx.lineWidth=Math.max(1,r*.35);
    for(const p of M.points[id]){
      if(hidden(p))continue;
      const X=sx(toU(p.x)),Y=sy(toV(p.z));
      if(X<-20||Y<-20||X>VW+20||Y>VH+20)continue;
      ctx.globalAlpha=isDone(p)?DONE_ALPHA:1;
      ctx.fillStyle=col;ctx.strokeStyle='#0b0f14cc';
      ctx.beginPath();ctx.arc(X,Y,r,0,7);ctx.fill();ctx.stroke();
      ctx.globalAlpha=1;
      if(sel&&sel.p===p){
        ctx.strokeStyle='#ffffff';ctx.lineWidth=2;
        ctx.beginPath();ctx.arc(X,Y,r*2.1,0,7);ctx.stroke();
        ctx.lineWidth=Math.max(1,r*.35);
      }
    }
  }
  // etiketler / labels
  const t=T();
  const labels=[];
  const dy=radius('relic')+10;
  for(const id of ['relic','trace']){
    if(!on[id]||!M.points[id])continue;
    const col=id==='relic'?'#ffe9a3':'#ffb3b3';
    for(const p of M.points[id]){
      if(hidden(p))continue;
      labels.push({p,t:p.rom?`${t.kinds[p.kind]} ${p.rom}`:p.n,col,dy});
    }
  }
  if(on.klore&&M.points.klore&&view.k>=26)
    for(const p of M.points.klore){if(!hidden(p))labels.push({p,t:t.knowledgeWord,col:'#bfe6ff',dy:radius('klore')+9});}
  const FS=(document.fullscreenElement||document.webkitFullscreenElement)?1.45:1;
  if(view.k>=16){
    ctx.font='700 '+Math.round(12*FS)+'px system-ui, sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.lineWidth=3.5;ctx.strokeStyle='#0b0f14e6';
    const put=[];
    for(const Lb of labels){
      const X=sx(toU(Lb.p.x)),Y=sy(toV(Lb.p.z))+Lb.dy;
      if(X<0||Y<0||X>VW||Y>VH)continue;
      const w=ctx.measureText(Lb.t).width+8;
      if(put.some(q=>Math.abs(q[0]-X)<(q[2]+w)/2&&Math.abs(q[1]-Y)<13))continue;
      put.push([X,Y,w]);
      ctx.globalAlpha=isDone(Lb.p)?DONE_ALPHA:1;
      ctx.fillStyle=Lb.col;
      ctx.strokeText(Lb.t,X,Y);ctx.fillText(Lb.t,X,Y);
      ctx.globalAlpha=1;
    }
  }
  if(on.node&&M.points.node){
    ctx.font='600 '+Math.round(11*FS)+'px system-ui, sans-serif';
    ctx.textAlign='center';ctx.textBaseline='bottom';
    ctx.lineWidth=3;ctx.strokeStyle='#0b0f14cc';ctx.fillStyle='#dbe7c9';
    for(const p of M.points.node){
      const X=sx(toU(p.x)),Y=sy(toV(p.z));
      if(X<0||Y<0||X>VW||Y>VH)continue;
      const tt=p.n.split('—').pop().trim();
      ctx.strokeText(tt,X,Y-7);ctx.fillText(tt,X,Y-7);
    }
  }
  placeSel();
}
// ── Seçim / Selection
function placeSel(){
  if(!sel){selEl.style.display='none';return;}
  const X=sx(toU(sel.p.x)),Y=sy(toV(sel.p.z));
  selEl.style.display='block';
  selEl.style.left=Math.max(8,Math.min(X+16,VW-selEl.offsetWidth-8))+'px';
  selEl.style.top=Math.max(8,Math.min(Y+14,VH-selEl.offsetHeight-8))+'px';
}
function coinOf(p,id){return id==='relic'?10:id==='trace'?(COIN_TRACE[p.num]||0):0;}
function select(p,id){
  sel={p,id};
  const t=T();
  document.getElementById('sel-t').textContent=p.n;
  const base=CHEST.includes(id)?`${p.a}${p.card?' · '+t.knowledgeWord+' '+p.card:''}`:`${t.layers[id]}`;
  const coin=CHEST.includes(id)?coinOf(p,id):null;
  document.getElementById('sel-s').innerHTML=
    (coin!=null&&coin>0?`<div class="sel-coin"><img class="prog-coin-ic" src="${COIN_ICON}" alt="">${t.coinName}: ${coin}</div>`:'')+
    `<div class="sel-area">${base}</div>`;
  const b=document.getElementById('sel-done');
  b.style.display=p.kind?'':'none';
  b.textContent=isDone(p)?t.unmark:t.markFound;
  b.classList.toggle('on',isDone(p));
  document.getElementById('sel-hint').textContent=p.kind?t.dblHint:'';
  const imgs=imagesFor(p);
  const gal=document.getElementById('sel-imgs');
  gal.innerHTML='';
  imgs.forEach((src,i)=>{
    const im=document.createElement('img');
    im.src=imgURL(src);im.loading='lazy';im.alt=p.n;im.referrerPolicy='no-referrer';
    im.onclick=()=>openLb(imgs,i,p.n);
    gal.appendChild(im);
  });
  draw();
}
function toggleDone(p,id,quiet){
  if(!p.kind)return;
  const k=keyOf(p);
  const was=DONE.has(k);
  was?DONE.delete(k):DONE.add(k);
  saveDone();
  if(sel&&sel.p===p)select(p,id);
  progress();search();draw();
  if(!quiet)toast(was?T().toastUnfound(p.n):T().toastFound(p.n));
}
document.getElementById('sel-done').onclick=()=>{if(sel)toggleDone(sel.p,sel.id,true);};
addEventListener('keydown',e=>{
  if(lbEl.classList.contains('open'))return;
  if(document.activeElement===document.getElementById('q'))return;
  if((e.key===' '||e.key==='Enter')&&sel&&sel.p.kind){e.preventDefault();toggleDone(sel.p,sel.id,true);}
});
// ── Etkileşim / Interaction
let drag=null;
cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,u:view.u,v:view.v};cv.setPointerCapture(e.pointerId);cv.classList.add('drag');});
cv.addEventListener('pointerup',e=>{
  if(drag&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<4){
    const near=nearest(e);
    if(near)select(near.p,near.id);else{sel=null;draw();}
  }
  drag=null;cv.classList.remove('drag');
});
cv.addEventListener('dblclick',e=>{
  const near=nearest(e);
  if(near&&near.p.kind)toggleDone(near.p,near.id);
});
cv.addEventListener('pointermove',e=>{
  if(drag){
    view.u=drag.u-(e.clientX-drag.x)/view.k;
    view.v=drag.v-(e.clientY-drag.y)/view.k;
    clamp();draw();tipEl.style.display='none';return;
  }
  hover(e);
});
cv.addEventListener('wheel',e=>{
  e.preventDefault();
  const u0=pux(e.clientX),v0=pvy(e.clientY);
  view.k=Math.max(kFit(),Math.min(256,view.k*Math.pow(1.0016,-e.deltaY)));
  view.u=u0-(e.clientX-VW/2)/view.k;
  view.v=v0-(e.clientY-VH/2)/view.k;
  clamp();draw();
},{passive:false});
// ── Lightbox
let lbList=[],lbIdx=0;
const lbEl=document.getElementById('lb'),lbImg=document.getElementById('lb-img');
function renderLb(){
  if(!lbList.length)return;
  lbImg.src=imgURL(lbList[lbIdx]);
  lbImg.referrerPolicy='no-referrer';
  document.getElementById('lb-count').textContent=lbList.length>1?`${lbIdx+1} / ${lbList.length}`:'';
  const multi=lbList.length>1?'':'hidden';
  document.getElementById('lb-prev').style.visibility=multi;
  document.getElementById('lb-next').style.visibility=multi;
}
function openLb(list,i,title){lbList=list;lbIdx=i||0;document.getElementById('lb-title').textContent=title||'';renderLb();lbEl.classList.add('open');}
function lbGo(d){if(lbList.length){lbIdx=(lbIdx+d+lbList.length)%lbList.length;renderLb();}}
function closeLb(){lbEl.classList.remove('open');lbImg.src='';}
document.getElementById('lb-prev').onclick=e=>{e.stopPropagation();lbGo(-1);};
document.getElementById('lb-next').onclick=e=>{e.stopPropagation();lbGo(1);};
document.getElementById('lb-close').onclick=e=>{e.stopPropagation();closeLb();};
lbEl.addEventListener('click',e=>{if(e.target===lbEl)closeLb();});
addEventListener('keydown',e=>{
  if(!lbEl.classList.contains('open'))return;
  if(e.key==='ArrowLeft')lbGo(-1);
  else if(e.key==='ArrowRight')lbGo(1);
  else if(e.key==='Escape')closeLb();
});
let lbSwipe=null;
lbEl.addEventListener('pointerdown',e=>{lbSwipe=e.clientX;});
lbEl.addEventListener('pointerup',e=>{
  if(lbSwipe==null)return;
  const dx=e.clientX-lbSwipe;lbSwipe=null;
  if(Math.abs(dx)>40)lbGo(dx<0?1:-1);
});
let toastT;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;el.style.opacity=1;
  clearTimeout(toastT);toastT=setTimeout(()=>el.style.opacity=0,1600);
}
function nearest(e,R=18){
  let best=null,bd=R*R;
  for(const id in M.points){
    if(!on[id])continue;
    for(const p of M.points[id]){
      if(hidden(p))continue;
      const dx=sx(toU(p.x))-e.clientX,dy2=sy(toV(p.z))-e.clientY;
      const d=dx*dx+dy2*dy2;
      if(d<bd){bd=d;best={p,id};}
    }
  }
  return best;
}
function hover(e){
  const best=nearest(e);
  if(!best||best.id==='relic'||best.id==='trace'||best.id==='klore'){tipEl.style.display='none';return;}
  const{p,id}=best;
  const t=T();
  tipEl.innerHTML=`<div><b>${p.n}</b>${isDone(p)?' <span class="k">'+t.foundTag+'</span>':''}</div>`+
    (CHEST.includes(id)?`<div class="k">${p.a}</div>`:`<div class="k">${t.layers[id]}</div>`);
  tipEl.style.display='block';
  tipEl.style.left=Math.min(e.clientX+14,VW-tipEl.offsetWidth-8)+'px';
  tipEl.style.top=(e.clientY+16)+'px';
}
// ── Katmanlar / Layer UI
function buildLayers(){
  const t=T();
  const box=document.getElementById('layers');
  box.innerHTML='';
  for(const id of ['relic','trace','klore','node','npc']){
    if(!M.points[id])continue;
    const el=document.createElement('label');
    el.className='layer';
    el.innerHTML=`<input type="checkbox" ${on[id]?'checked':''}>`+
      `<span class="dot" style="background:${M.meta.layers[id].color}"></span>`+
      `<span class="nm">${t.layers[id]}</span><span class="ct">${M.points[id].length}</span>`;
    el.querySelector('input').onchange=e=>{on[id]=e.target.checked;search();draw();};
    box.appendChild(el);
  }
}
// ── Arama / Search (TR+EN anahtar kelimeler, Roma rakamları)
const ROMAN={I:1,V:5,X:10,L:50,C:100};
function fromRoman(s){
  let t=0;
  for(let i=0;i<s.length;i++){
    const a=ROMAN[s[i]],b=ROMAN[s[i+1]];
    if(!a)return null;
    t+=(b&&a<b)?-a:a;
  }
  return t||null;
}
const trUp=s=>s.toLocaleUpperCase('tr-TR');
function focusPoint(p,id){
  view.k=Math.max(view.k,70);
  view.u=toU(p.x);view.v=toV(p.z);
  clamp();select(p,id);
}
const KINDWORDS={'MİRAS':'relic','MIRAS':'relic','LEGACY':'relic','İZ':'trace','IZ':'trace','TRACE':'trace','BİLGİ':'klore','BILGI':'klore','KNOWLEDGE':'klore'};
function search(){
  const raw=document.getElementById('q').value.trim();
  const hits=document.getElementById('hits');
  hits.innerHTML='';
  if(!raw)return;
  let kind=null;
  const toks=trUp(raw).split(/\s+/).filter(tk=>{
    const kw=KINDWORDS[tk]||KINDWORDS[tk.replace(/İ/g,'I')];
    if(kw){kind=kw;return false;}
    return true;
  });
  const rest=toks.join(' ');
  const restRoman=rest.replace(/İ/g,'I').replace(/\s+/g,'');
  const num=/^\d+$/.test(restRoman)?+restRoman:(/^[IVXLC]+$/.test(restRoman)?fromRoman(restRoman):null);
  const out=[];
  for(const id of ['relic','trace','klore','node','npc']){
    if(!on[id]||!M.points[id])continue;
    for(const p of M.points[id]){
      const hay=trUp((p.n||'')+' '+(p.a||''));
      let ok;
      if(CHEST.includes(id)){
        if(kind&&p.kind!==kind)continue;
        if(num!=null)ok=p.num===num;
        else if(rest)ok=hay.includes(rest);
        else ok=!!kind;
      }else if(id==='klore'){
        if(kind&&kind!=='klore')continue;
        if(num!=null)continue;
        ok=rest?hay.includes(rest):kind==='klore';
      }else{
        if(kind||num!=null)continue;
        ok=!!rest&&hay.includes(rest);
      }
      if(!ok)continue;
      out.push({p,id});
      if(out.length>40)break;
    }
  }
  if(!out.length){hits.innerHTML='<div class="none">'+T().noresult+'</div>';return;}
  for(const h of out.slice(0,12)){
    const d=document.createElement('div');
    if(isDone(h.p))d.className='off';
    d.innerHTML=`<span class="dot" style="background:${M.meta.layers[h.id].color}"></span>`+
      `<span>${h.p.n}</span><span class="a">${h.p.a||''}</span>`;
    d.onclick=()=>{focusPoint(h.p,h.id);draw();};
    hits.appendChild(d);
  }
}
document.getElementById('q').addEventListener('input',search);
document.getElementById('q').addEventListener('keydown',e=>{
  if(e.key==='Enter')document.querySelector('#hits div:not(.none)')?.click();
  if(e.key==='Escape'){e.target.value='';search();}
});
// ── İlerleme / Progress
const pctF=p=>lang==='en'?`(${p}%)`:`(%${p})`;
function coinStats(){
  let earned=0,total=0;
  for(const p of (M.points.relic||[])){total+=10;if(isDone(p))earned+=10;}
  for(const p of (M.points.trace||[])){const v=COIN_TRACE[p.num]||0;total+=v;if(isDone(p))earned+=v;}
  return{earned,total,pct:total?Math.round(earned/total*100):0};
}
function progress(){
  const t=T();
  const tot=new Set(DONEABLE.map(keyOf));
  const el=document.getElementById('prog');
  const per=k=>{
    const all=[...tot].filter(x=>x.startsWith(k+'-')).length;
    const got=[...DONE].filter(x=>x.startsWith(k+'-')&&tot.has(x)).length;
    const pct=all?Math.round(got/all*100):0;
    return`<div class="prog-row"><b class="prog-k">${t.kinds[k]}</b> : <b>${got}</b>/${all} <span class="prog-pct">${pctF(pct)}</span></div>`;
  };
  const c=coinStats();
  const coinRow=`<div class="prog-coin"><img class="prog-coin-ic" src="${COIN_ICON}" alt="">`+
    `<b>${t.coinShort}</b> : <b>${c.earned}</b>/${c.total} <span class="prog-pct">${pctF(c.pct)}</span></div>`;
  el.innerHTML=coinRow+`<div class="prog-h">${t.progress}</div>${per('relic')}${per('trace')}${per('klore')}`;
}
// ── Statik arayüz metinleri / Static UI text
function applyLang(){
  const t=T();
  document.title=t.title;
  document.documentElement.lang=lang;
  document.getElementById('ui-title').textContent=t.h1;
  document.getElementById('ui-caret').textContent=document.getElementById('ui').classList.contains('collapsed')?t.expand:t.collapse;
  document.getElementById('q').placeholder=t.ph;
  document.getElementById('hidefound-label').textContent=t.hideFound;
  document.getElementById('btn-fit').textContent=t.fit;
  document.getElementById('btn-reset').textContent=t.reset;
  document.getElementById('btn-export').textContent=t.save;
  document.getElementById('btn-import').textContent=t.load;
  document.getElementById('btn-fs').textContent=t.fs;
  document.getElementById('lang-tr').classList.toggle('on',lang==='tr');
  document.getElementById('lang-en').classList.toggle('on',lang==='en');
  applyNames();
  buildLayers();
  progress();
  if(sel)select(sel.p,sel.id);
  search();
  draw();
}
function setLang(l){
  lang=l;
  try{localStorage.setItem(LANG_STORE,l);}catch(e){}
  applyLang();
}
document.getElementById('lang-tr').onclick=()=>setLang('tr');
document.getElementById('lang-en').onclick=()=>setLang('en');
// Bulunanları gizle / Hide found
const hf=document.getElementById('hide-found');
hf.checked=hideFound;
hf.onchange=()=>{
  hideFound=hf.checked;
  try{localStorage.setItem('bdo_tachyon_hidefound',hideFound?'1':'0');}catch(e){}
  if(sel&&hidden(sel.p)){sel=null;}
  draw();
};
// Panel aç/kapa / Collapse
document.getElementById('ui-head').addEventListener('click',()=>{
  const collapsed=document.getElementById('ui').classList.toggle('collapsed');
  document.getElementById('ui-caret').textContent=collapsed?T().expand:T().collapse;
});
document.getElementById('btn-fit').onclick=()=>{
  view.u=(BOX.u0+BOX.u1)/2;view.v=(BOX.v0+BOX.v1)/2;view.k=kFit();
  sel=null;clamp();draw();
};
document.getElementById('btn-reset').onclick=()=>{
  if(!DONE.size||!confirm(T().confirmReset(DONE.size)))return;
  DONE.clear();saveDone();progress();search();draw();
};
document.getElementById('btn-export').onclick=()=>{
  const data={app:'tachyon-done',version:2,saved:new Date().toISOString(),done:[...DONE]};
  const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const d=new Date();
  const stamp=`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
  const a=document.createElement('a');
  a.href=url;a.download=`tachyon_${stamp}.json`;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast(T().toastSaved(DONE.size));
};
document.getElementById('btn-import').onclick=()=>document.getElementById('file-import').click();
document.getElementById('file-import').onchange=(e)=>{
  const f=e.target.files&&e.target.files[0];
  e.target.value='';
  if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const parsed=JSON.parse(r.result);
      const arr=Array.isArray(parsed)?parsed:(parsed&&parsed.done);
      if(!Array.isArray(arr))throw new Error('format');
      DONE=new Set(arr.filter(x=>typeof x==='string').map(migrate));
      saveDone();progress();search();draw();
      toast(T().toastLoaded(DONE.size));
    }catch(err){toast(T().toastFail);}
  };
  r.readAsText(f);
};
document.getElementById('btn-fs').onclick=()=>{
  if(document.fullscreenElement)document.exitFullscreen();
  else document.documentElement.requestFullscreen();
};
addEventListener('resize',resize);
document.addEventListener('fullscreenchange',()=>{resize();setTimeout(resize,80);});
document.addEventListener('webkitfullscreenchange',()=>{resize();setTimeout(resize,80);});
applyLang();
resize();
document.getElementById('btn-fit').click();
</script>
