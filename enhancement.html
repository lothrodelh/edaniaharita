  - Pity (garantili geliştirme) ve cron adetleri oyun içi geliştirme penceresinde gösterilen resmi değerlerdir.

<style>
  :root { --bg:#0d1117; --panel:#161b22; --line:#2b3440; --fg:#e6edf3; --dim:#8b949e; --accent:#ffd54a; }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); color:var(--fg); font:13.5px/1.5 "Segoe UI", system-ui, sans-serif; }
  #nav { position:sticky; top:0; z-index:10; display:flex; align-items:center; gap:4px; padding:8px 14px; background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  #nav a { color:var(--fg); text-decoration:none; padding:5px 10px; border-radius:7px; font-size:13px; white-space:nowrap; }
  #nav a:hover { background:#ffffff12; }
  #nav a.act { color:var(--accent); font-weight:700; }
  #nav button { background:#21262d; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:4px 10px; cursor:pointer; font-size:12px; }
  #nav button:hover { background:#30363d; }
  #nav button.on { background:#2d5a3d; border-color:#3d7a52; font-weight:700; }
  main { max-width:1180px; margin:0 auto; padding:16px 14px 40px; }
  h1 { font-size:19px; margin:10px 0 2px; }
  .sub { color:var(--dim); font-size:12.5px; margin-bottom:14px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:13px 15px; margin-bottom:14px; }
  .grid { display:flex; gap:14px; flex-wrap:wrap; }
  .grid .card { flex:1; min-width:300px; }
  label.opt { display:flex; align-items:center; justify-content:space-between; gap:10px; margin:6px 0; }
  select,input[type=number],input[type=text] { background:#0d1117; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:5px 8px; font:inherit; font-size:12.5px; }
  input[type=number] { width:110px; text-align:right; font-variant-numeric:tabular-nums; }
  input.fs { width:64px; }
  .price-row { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:5px 0; font-size:12.5px; }
  .price-row .nm { color:var(--dim); }
  button.btn { background:#21262d; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:6px 12px; cursor:pointer; font:inherit; font-size:12.5px; }
  button.btn:hover { background:#30363d; }
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  th,td { padding:7px 9px; text-align:right; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--dim); font-size:11.5px; font-weight:600; }
  th:first-child,td:first-child { text-align:left; }
  td.lvl { font-weight:700; color:var(--accent); }
  tr.outside { opacity:.35; }
  tr.total td { font-weight:700; border-top:2px solid var(--line); }
  .pill { display:inline-block; background:#21262d; border:1px solid var(--line); border-radius:20px; padding:1px 9px; font-size:11px; color:var(--dim); }
  .warn { color:#ffb3b3; font-size:12px; }
  .ok { color:#9be36b; }
  #toast { position:fixed; left:50%; bottom:26px; transform:translateX(-50%); background:#161b22f2; border:1px solid var(--line); border-radius:8px; padding:8px 14px; font-size:12.5px; opacity:0; transition:opacity .25s; pointer-events:none; z-index:50; }
  footer { color:var(--dim); font-size:11.5px; margin-top:22px; border-top:1px solid var(--line); padding-top:10px; }
  footer a { color:var(--dim); }
  .note { color:var(--dim); font-size:12px; margin-top:8px; }
</style>

      <label class="opt"><span id="l-item"></span>

        <button class="btn" id="btn-live"></button>
      </div>
      <div class="note" id="live-status"></div>
    </div>
  </div>

  <div class="card" style="overflow-x:auto">

      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="note" id="n-model"></div>
  </div>

 fsNote:"Note: failstack building cost is not included — see the FS Cost page.",
 cronEditNote:"Cron counts vary per accessory — edit the cron column for your item.",
 pityNote:"Pity: the click after the listed number of fails is guaranteed.",
 defNote:"Default prices are examples (MENA scale) — adjust for your server or fetch live.",
 ft:"Game values are official in-game numbers; code is original to this site."}};
let lang='tr';
try{const s=localStorage.getItem('bdo_tachyon_lang');if(s==='en'||s==='tr')lang=s;}catch(e){}
const T=()=>L10N[lang];

// ── Durum / State
const S={item:'kharazad',start:0,goal:10,valks:10,fsMap:{},valksMap:{},cronOv:{},prices:{cron:CRON_DEF},baseCost:0};
try{const st=JSON.parse(localStorage.getItem('bdo_enh_v2')||'{}');Object.assign(S,st);}catch(e){}
if(!ITEMS[S.item])S.item='kharazad';
const save=()=>{try{localStorage.setItem('bdo_enh_v2',JSON.stringify(S));}catch(e){}};
const IT=()=>ITEMS[S.item];
const nLv=()=>IT().levels.length;
function fsArr(){if(!S.fsMap[S.item]){const d=IT().sys==='x'?DEF_FS_X:DEF_FS_LEG;S.fsMap[S.item]=IT().levels.map((_,i)=>d[Math.min(i,d.length-1)]);}return S.fsMap[S.item];}
function vArr(){if(!S.valksMap[S.item])S.valksMap[S.item]=IT().levels.map(()=>true);return S.valksMap[S.item];}
function cronOf(i){const ov=S.cronOv[S.item];return (ov&&ov[i]!=null)?ov[i]:IT().levels[i][3];}
const priceOf=k=>S.prices[k]??MAT[k].def;

// ── Motor / Engine
function chanceOf(base,fs,sys){
  if(sys==='fix')return Math.min(90,base);
  if(sys==='x')return Math.min(90,base*(1+fs/10));
  let c=base;
  for(let i=0;i<fs;i++){c+=c<70?base/10:base/50;if(c>=90)return 90;}
  return Math.min(90,c);
}
function levelStats(i){
  const it=IT();
  const [nm,base,pity,,matKey,qty]=it.levels[i];
  const cron=cronOf(i);
  const fsEff=(it.sys==='fix')?0:fsArr()[i]+(vArr()[i]?+S.valks:0);
  const p=Math.max(0.000001,chanceOf(base,fsEff,it.sys)/100);
  let E=0,q=1;
  if(pity>0){for(let k=1;k<=pity;k++){E+=k*q*p;q*=(1-p);}E+=(pity+1)*q;}
  else E=1/p;
  const pPity=pity>0?Math.pow(1-p,pity):0;
  const clickCost=cron*S.prices.cron+qty*priceOf(matKey);
  return{nm,pity,cron,qty,matKey,p,E,pPity,clickCost};
}
function computeAll(){
  const it=IT(),out=[];
  let prevC=0,prevCr=0,prevM={};
  for(let i=0;i<it.levels.length;i++){
    const s=levelStats(i);
    let C,Cr,Mq;
    if(it.drop){ // başarısızlıkta -1 seviye: yeniden tırmanma dahil
      C=s.E*s.clickCost+(s.E-1)*prevC;
      Cr=s.E*s.cron+(s.E-1)*prevCr;
      Mq={};Mq[s.matKey]=s.E*s.qty;
      for(const k in prevM)Mq[k]=(Mq[k]||0)+(s.E-1)*prevM[k];
    }else{
      C=s.E*s.clickCost;Cr=s.E*s.cron;Mq={};Mq[s.matKey]=s.E*s.qty;
    }
    out.push({...s,C,Cr,Mq});
    prevC=C;prevCr=Cr;prevM=Mq;
  }
  return out;
}

// ── Biçim / Format
const loc=()=>lang==='en'?'en-US':'tr-TR';
const fmt=n=>Math.round(n).toLocaleString(loc());
const fmtPct=p=>(p*100).toLocaleString(loc(),{maximumFractionDigits:2})+' %';

// ── Render
function buildSelectors(){
  const t=T(),it=IT();
  const st=document.getElementById('start'),go=document.getElementById('goal');
  st.innerHTML='';go.innerHTML='';
  const bo=document.createElement('option');bo.value=0;bo.textContent=t.base;st.appendChild(bo);
  it.levels.forEach((L,i)=>{
    const nm=ROMMAP[L[0]]?`${L[0]} (${ROMMAP[L[0]]})`:L[0];
    if(i<it.levels.length-1){const o=document.createElement('option');o.value=i+1;o.textContent=nm;st.appendChild(o);}
    const o2=document.createElement('option');o2.value=i+1;o2.textContent=nm;go.appendChild(o2);
  });
  if(S.start>=it.levels.length)S.start=0;
  if(S.goal>it.levels.length||S.goal<=S.start)S.goal=it.levels.length;
  st.value=S.start;go.value=S.goal;
}
function buildPrices(){
  const it=IT();
  document.getElementById('p-cron').value=S.prices.cron;
  const box=document.getElementById('mat-prices');
  box.innerHTML='';
  const keys=[...new Set(it.levels.map(L=>L[4]))];
  for(const k of keys){
    const m=MAT[k];
    const row=document.createElement('div');row.className='price-row';
    row.innerHTML=`<span class="nm">${lang==='en'?m.en:m.tr}</span>`;
    const inp=document.createElement('input');inp.type='number';inp.min=0;inp.step=100000;inp.value=priceOf(k);
    inp.oninput=()=>{S.prices[k]=+inp.value||0;save();renderTable();};
    row.appendChild(inp);box.appendChild(row);
  }
}
function renderTable(){
  const t=T(),it=IT();
  const all=computeAll();
  const tb=document.getElementById('tbody');
  tb.innerHTML='';
  let cum=+S.baseCost||0,cumC=0,cumM=0;
  all.forEach((s,i)=>{
    const lv=i+1;
    const inRange=lv>S.start&&lv<=S.goal;
    const matSum=Object.values(s.Mq).reduce((a,b)=>a+b,0);
    if(inRange){cum+=s.C;cumC+=s.Cr;cumM+=matSum;}
    const tr=document.createElement('tr');
    if(!inRange)tr.className='outside';
    const nm=ROMMAP[s.nm]?`${s.nm} (${ROMMAP[s.nm]})`:s.nm;
    const fsCell=it.sys==='fix'?'—':`<input class="fs" type="number" min="0" max="400" value="${fsArr()[i]}" data-i="${i}">`;
    const vCell=it.sys==='fix'?'—':`<input type="checkbox" data-v="${i}" ${vArr()[i]?'checked':''}>`;
    const cronCell=it.cronEdit?`<input class="fs" type="number" min="0" value="${cronOf(i)}" data-c="${i}">`:fmt(s.Cr);
    tr.innerHTML=`<td class="lvl">${nm}</td>
      <td>${fsCell}</td><td>${vCell}</td>
      <td>${fmtPct(s.p)}</td>
      <td>${s.E.toLocaleString(loc(),{maximumFractionDigits:2})}</td>
      <td>${s.pity||'—'}</td>
      <td>${cronCell}</td>
      <td>${fmt(matSum)}</td>
      <td>${fmt(s.C)}</td>
      <td>${inRange?fmt(cum):'—'}</td>
      <td>${s.pity?fmtPct(s.pPity):'—'}</td>`;
    tb.appendChild(tr);
  });
  const tr=document.createElement('tr');tr.className='total';
  tr.innerHTML=`<td>${t.total}</td><td></td><td></td><td></td><td></td><td></td>
    <td>${fmt(cumC)}</td><td>${fmt(cumM)}</td><td></td><td class="ok">${fmt(cum)}</td><td></td>`;
  tb.appendChild(tr);
  tb.querySelectorAll('input.fs[data-i]').forEach(inp=>{
    inp.oninput=()=>{fsArr()[+inp.dataset.i]=Math.max(0,Math.min(400,+inp.value||0));save();renderTable();};
  });
  tb.querySelectorAll('input.fs[data-c]').forEach(inp=>{
    inp.oninput=()=>{if(!S.cronOv[S.item])S.cronOv[S.item]=[];S.cronOv[S.item][+inp.dataset.c]=Math.max(0,+inp.value||0);save();renderTable();};
  });
  tb.querySelectorAll('input[type=checkbox][data-v]').forEach(cb=>{
    cb.onchange=()=>{vArr()[+cb.dataset.v]=cb.checked;save();renderTable();};
  });
  // notlar / notes
  const notes=[];
  notes.push(it.sys==='x'?t.sysx:it.sys==='leg'?t.sysleg:t.sysfix);
  notes.push(t.pityNote);
  if(it.drop)notes.push(t.dropNote);
  if(it.dura)notes.push(t.duraNote);
  if(it.cronEdit)notes.push(t.cronEditNote);
  if(it.approx)notes.push(t.approxNote);
  notes.push(t.fsNote,t.defNote);
  document.getElementById('n-model').innerHTML=notes.map(n=>'• '+n).join('<br>');
}
function applyLang(){
  const t=T();
  document.title=(lang==='en'?'Enhancement Calculator — BDO':'Geliştirme Hesaplayıcı — BDO');
  document.documentElement.lang=lang;
  const set=(id,v)=>document.getElementById(id).textContent=v;
  set('nv-map',t.nvMap);set('nv-enh',t.nvEnh);set('nv-fs',t.nvFs);set('nv-ls',t.nvLs);
  set('h1',t.h1);set('sub',t.sub);
  set('l-item',t.item);set('l-start',t.start);set('l-goal',t.goal);set('l-valks',t.valks);set('l-base-cost',t.baseCost);
  set('l-cron',t.cron);set('btn-live',t.live);
  set('th-lvl',t.lvl);set('th-valks',t.valksTh);set('th-chance',t.chance);set('th-clicks',t.clicks);
  set('th-pity',t.pity);set('th-crons',t.crons);set('th-mats',t.mats);set('th-cost',t.cost);set('th-cum',t.cum);set('th-oddspity',t.oddspity);
  set('n-formula',t.pityNote);set('ft',t.ft);
  document.getElementById('lang-tr').classList.toggle('on',lang==='tr');
  document.getElementById('lang-en').classList.toggle('on',lang==='en');
  const sel=document.getElementById('item');
  sel.innerHTML='';
  for(const k in ITEMS){const o=document.createElement('option');o.value=k;o.textContent=lang==='en'?ITEMS[k].en:ITEMS[k].tr;sel.appendChild(o);}
  sel.value=S.item;
  buildSelectors();buildPrices();renderTable();
}
function setLang(l){lang=l;try{localStorage.setItem('bdo_tachyon_lang',l);}catch(e){}applyLang();}
document.getElementById('lang-tr').onclick=()=>setLang('tr');
document.getElementById('lang-en').onclick=()=>setLang('en');

const el=id=>document.getElementById(id);
el('item').onchange=()=>{S.item=el('item').value;S.start=0;S.goal=ITEMS[S.item].levels.length;save();applyLang();};
el('start').onchange=()=>{S.start=+el('start').value;if(S.goal<=S.start)S.goal=S.start+1;save();buildSelectors();renderTable();};
el('goal').onchange=()=>{S.goal=+el('goal').value;if(S.goal<=S.start)S.start=S.goal-1;save();buildSelectors();renderTable();};
el('valks').value=S.valks;
el('valks').onchange=()=>{S.valks=+el('valks').value;save();renderTable();};
el('baseCost').value=S.baseCost;
el('baseCost').oninput=()=>{S.baseCost=+el('baseCost').value||0;save();renderTable();};
el('p-cron').oninput=()=>{S.prices.cron=+el('p-cron').value||0;save();renderTable();};

// ── Canlı fiyat / Live prices (arsha.io)
let toastT;
function toast(m){const e=el('toast');e.textContent=m;e.style.opacity=1;clearTimeout(toastT);toastT=setTimeout(()=>e.style.opacity=0,2500);}
el('btn-live').onclick=async()=>{
  const t=T(),it=IT(),reg=el('region').value;
  el('live-status').textContent=t.liveWait;
  try{
    const keys=[...new Set(it.levels.map(L=>L[4]))].filter(k=>MAT[k].id>0);
    if(!keys.length)throw new Error('no ids');
    const q=keys.map(k=>'id='+MAT[k].id).join('&');
    const r=await fetch(`https://api.arsha.io/v2/${reg}/item?${q}&lang=en`);
    if(!r.ok)throw new Error('http '+r.status);
    const data=await r.json();
    const arr=Array.isArray(data)?data:[data];
    let n=0;
    for(const k of keys){
      const m=MAT[k];
      const hit=arr.find(x=>x&&(x.id===m.id||x.mainKey===m.id));
      const price=hit&&(hit.basePrice??hit.pricePerOne??hit.lastSoldPrice);
      if(price>0){S.prices[k]=price;n++;}
    }
    if(!n)throw new Error('no data');
    save();buildPrices();renderTable();
    el('live-status').textContent='';toast(t.liveOk);
  }catch(e){el('live-status').textContent='';toast(t.liveFail);}
};

applyLang();
</script>
</html>
